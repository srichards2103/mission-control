services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mission
      POSTGRES_PASSWORD: mission
      POSTGRES_DB: mission_control
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mission -d mission_control"]
      interval: 2s
      retries: 20
  backend:
    build: ./backend
    command: sh -c "uv sync && uv run python manage.py migrate && uv run python manage.py seed_demo && uv run python manage.py runserver 0.0.0.0:8000"
    volumes: ["./backend:/app", "/app/.venv"]
    environment:
      DATABASE_URL: postgres://mission:mission@db:5432/mission_control
      DEBUG: "true"
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    ports: ["5173:5173"]
volumes:
  pgdata:
