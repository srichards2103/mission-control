name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: mission, POSTGRES_PASSWORD: mission, POSTGRES_DB: mission_control}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mission -d mission_control" --health-interval 2s --health-retries 20
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env: {DJANGO_SETTINGS_MODULE: config.settings_test}
      - run: uv run pytest
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build
